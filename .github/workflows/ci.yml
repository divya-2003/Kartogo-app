name: CI

on:
  push:
  pull_request:

jobs:
  brand-guard:
    name: Brand guard (no "Kartigo")
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Fail if "Kartigo" appears in frontend source
        run: bun run check:brand
